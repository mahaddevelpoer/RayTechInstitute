name: Build and deploy RayTech static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read

concurrency:
  group: raytech-firebase-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and catalog behaviour
        run: npm run lint && npm run typecheck && npm test && npm run test:codi && node --test scripts/static-release.test.mjs scripts/home-directory.test.mjs scripts/codi-sentences.test.mjs scripts/codi-audio-cache.test.mjs scripts/codi-storage-cache.test.mjs scripts/learning-workspace.test.mjs scripts/lesson-depth.test.mjs

      - name: Use Java 21 for local Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install browser on GitHub for sentence interaction checks
        run: npx playwright install --with-deps chromium

      - name: Verify sentence hover, layout and original teaching controls
        run: node --max-old-space-size=384 scripts/codi-sentence-browser.mjs

      - name: Verify private student progress rules
        run: npm run test:rules

      - name: Build static catalog and website
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Block incomplete or mismatched exports
        run: node scripts/verify-static-release.mjs && node --max-old-space-size=512 scripts/audit-export-links.mjs && node --test scripts/codi-audio-pipeline.test.mjs

      - name: Retain release manifest for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            out/deployment.json
            out/**/*.html

      - name: Deploy to Firebase Hosting live channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAYTECHINSTITUTE }}
          projectId: raytechinstitute
          channelId: live

      - name: Verify deployed pages match this exact export
        run: node scripts/verify-live-export.mjs

      - name: Verify ready MP3 plays on desktop and mobile without an AI call
        if: ${{ !cancelled() && steps.hosting.outcome == 'success' }}
        run: node --max-old-space-size=384 scripts/verify-prepared-audio.mjs && node --max-old-space-size=384 scripts/verify-learning-panels.mjs

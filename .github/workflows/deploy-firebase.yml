name: Build and deploy RayTech static site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosting_target:
        description: 'Hosting destination; artifact builds do not change either live site'
        type: choice
        options: [firebase, cloudflare, artifact, verify-cloudflare, review-dns]
        default: firebase
      export_run_id:
        description: 'Successful artifact-mode run to verify without rebuilding'
        type: string
        required: false
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read
  actions: read

concurrency:
  group: raytech-static-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: inputs.hosting_target != 'verify-cloudflare' && inputs.hosting_target != 'review-dns'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      HOSTING_TARGET: ${{ inputs.hosting_target || vars.HOSTING_PROVIDER || 'firebase' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and catalog behaviour
        if: github.event_name != 'repository_dispatch'
        run: npm run lint && npm run typecheck && npm test && npm run test:codi && node --test scripts/static-release.test.mjs scripts/home-directory.test.mjs scripts/codi-sentences.test.mjs scripts/codi-audio-cache.test.mjs scripts/codi-storage-cache.test.mjs scripts/learning-workspace.test.mjs scripts/lesson-depth.test.mjs scripts/practice-security.test.mjs scripts/resource-reliability.test.mjs scripts/learning-provider.test.mjs scripts/admin-catalog.test.mjs scripts/english-interface.test.mjs scripts/notes-publishing.test.mjs scripts/multi-class.test.mjs scripts/dit-mcqs.test.mjs scripts/office-mcqs.test.mjs scripts/word-and-brand.test.mjs scripts/chapter-books.test.mjs scripts/book-notes.test.mjs

      - name: Use Java 21 for local Firestore rules tests
        # Source-only tests; changing this workflow locally does not authorize a release.
        if: github.event_name != 'repository_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify academic placement validation and migration replay
        if: github.event_name != 'repository_dispatch'
        run: node --max-old-space-size=256 --test --test-concurrency=1 scripts/academic-structure.test.mjs scripts/academic-migration.test.mjs && node --max-old-space-size=256 scripts/check-academic-types.mjs

      - name: Verify private competition scoring and access controls
        if: github.event_name != 'repository_dispatch'
        run: npm run test:competition

      - name: Verify SEO metadata, schema, public assets and crawlable links
        if: github.event_name != 'repository_dispatch'
        run: npm run test:seo

      - name: Verify public page bundle, cookie consent and accessibility regressions
        if: github.event_name != 'repository_dispatch'
        run: npm run test:pagespeed

      - name: Restore the tested headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-${{ hashFiles('package-lock.json') }}

      - name: Install browser on GitHub for sentence interaction checks
        timeout-minutes: 3
        run: npx playwright install chromium --only-shell

      - name: Verify sentence hover, layout and original teaching controls
        if: github.event_name != 'repository_dispatch'
        run: node --max-old-space-size=384 scripts/codi-sentence-browser.mjs

      - name: Verify private student progress rules
        if: github.event_name != 'repository_dispatch'
        run: npm run test:rules

      - name: Validate changed content before a content-only release
        if: github.event_name == 'repository_dispatch'
        run: node --test scripts/learning-snapshot.test.mjs scripts/educational.test.mjs scripts/resource-reliability.test.mjs

      - name: Build static catalog and website
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_COMPETITION_ENDPOINT: ${{ vars.NEXT_PUBLIC_COMPETITION_ENDPOINT }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Block incomplete or mismatched exports
        run: node scripts/verify-static-release.mjs && node --max-old-space-size=512 scripts/audit-export-links.mjs && node --test scripts/codi-audio-pipeline.test.mjs

      - name: Prepare static Cloudflare routing and security headers
        if: env.HOSTING_TARGET != 'firebase'
        run: node --test scripts/cloudflare-export.test.mjs && node scripts/prepare-cloudflare-export.mjs

      - name: Retain release manifest for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            out/deployment.json
            out/**/*.html

      - name: Verify academic cards against the exported website before publishing
        run: node --max-old-space-size=384 scripts/verify-academic-cards.mjs

      - name: Retain academic navigation screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: academic-cards
          path: artifacts/academic-cards/*.png
          if-no-files-found: ignore

      - name: Start isolated export preview on GitHub
        run: |
          PORT=4178 node scripts/preview-static.mjs > /tmp/raytech-export-preview.log 2>&1 &
          node -e "let ready=false;for(let n=0;n<40&&!ready;n++){try{ready=(await fetch('http://127.0.0.1:4178/')).ok}catch{}if(!ready)await new Promise(r=>setTimeout(r,250));}if(!ready)process.exit(1)"

      - name: Verify ready MP3 plays on desktop and mobile without an AI call
        env:
          VERIFY_BASE_URL: http://127.0.0.1:4178
        run: node --test scripts/codi-audio-evidence.test.mjs && node --max-old-space-size=384 scripts/verify-prepared-audio.mjs

      - name: Verify learning panels and saved speech sources
        env:
          VERIFY_BASE_URL: http://127.0.0.1:4178
        run: node --max-old-space-size=384 scripts/verify-learning-panels.mjs

      - name: Verify learning controls
        env:
          VERIFY_BASE_URL: http://127.0.0.1:4178
        run: node --max-old-space-size=384 scripts/verify-learning-controls.mjs

      - name: Verify all redesigned resource directories and video placement
        env:
          VERIFY_BASE_URL: http://127.0.0.1:4178
        run: node --max-old-space-size=384 scripts/verify-resource-pages.mjs

      - name: Retain portable verified export for migration
        if: env.HOSTING_TARGET == 'artifact'
        run: tar -czf /tmp/raytech-static-export.tar.gz -C out .

      - name: Upload portable verified export
        if: env.HOSTING_TARGET == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-export
          path: /tmp/raytech-static-export.tar.gz
          retention-days: 3

      - name: Deploy to Firebase Hosting live channel
        if: env.HOSTING_TARGET == 'firebase'
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAYTECHINSTITUTE }}
          projectId: raytechinstitute
          channelId: live

      - name: Verify deployed pages match this exact export
        if: env.HOSTING_TARGET == 'firebase'
        run: node scripts/verify-live-export.mjs

      - name: Deploy verified export to Cloudflare Pages
        if: env.HOSTING_TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 67c68fe5eb47fcda8d58c8b5e5862f09
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare deployment secret is missing'; exit 1; }
          npx --yes wrangler@4.156.0 pages deploy out --project-name raytechinstitute --branch main --commit-dirty=false

      - name: Verify Cloudflare static delivery and compiler isolation
        if: env.HOSTING_TARGET == 'cloudflare'
        env:
          VERIFY_BASE_URL: https://raytechinstitute.pages.dev
        run: node --max-old-space-size=384 scripts/verify-cloudflare-preview.mjs

      - name: Retain learning presentation screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-presentation
          path: artifacts/learning-presentation/*.png
          if-no-files-found: ignore

      - name: Retain resource page screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resource-pages
          path: artifacts/resource-pages/*.png
          if-no-files-found: ignore

  review-dns:
    if: inputs.hosting_target == 'review-dns'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check imported DNS without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-cloudflare-dns.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dns-review
          path: artifacts/cloudflare-migration/dns-review.json
          retention-days: 3

  verify-cloudflare:
    if: inputs.hosting_target == 'verify-cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      VERIFY_BASE_URL: https://raytechinstitute.pages.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-static-export
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/cloudflare-migration
      - name: Restore previously verified public export
        run: mkdir -p out && tar -xzf artifacts/cloudflare-migration/raytech-static-export.tar.gz -C out
      - run: npx playwright install chromium --only-shell
      - name: Verify static delivery and isolated compiler execution on Cloudflare
        run: node --max-old-space-size=384 scripts/verify-cloudflare-preview.mjs
      - name: Review imported DNS and known live service records without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            node scripts/check-cloudflare-dns.mjs
          else
            echo 'DNS comparison pending: scoped GitHub secret has not been configured.'
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cloudflare-preview-verification
          path: |
            artifacts/cloudflare-migration/live-preview.json
            artifacts/cloudflare-migration/dns-review.json
          if-no-files-found: ignore

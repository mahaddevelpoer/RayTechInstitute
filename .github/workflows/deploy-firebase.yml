name: Build and deploy RayTech static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read

concurrency:
  group: raytech-firebase-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and catalog behaviour
        if: github.event_name != 'repository_dispatch'
        run: npm run lint && npm run typecheck && npm test && npm run test:codi && node --test scripts/static-release.test.mjs scripts/home-directory.test.mjs scripts/codi-sentences.test.mjs scripts/codi-audio-cache.test.mjs scripts/codi-storage-cache.test.mjs scripts/learning-workspace.test.mjs scripts/lesson-depth.test.mjs scripts/practice-security.test.mjs scripts/resource-reliability.test.mjs scripts/learning-provider.test.mjs scripts/admin-catalog.test.mjs scripts/english-interface.test.mjs scripts/notes-publishing.test.mjs scripts/multi-class.test.mjs

      - name: Use Java 21 for local Firestore rules tests
        if: github.event_name != 'repository_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the tested headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-headless-${{ hashFiles('package-lock.json') }}

      - name: Install browser on GitHub for sentence interaction checks
        timeout-minutes: 3
        run: npx playwright install chromium --only-shell

      - name: Verify sentence hover, layout and original teaching controls
        if: github.event_name != 'repository_dispatch'
        run: node --max-old-space-size=384 scripts/codi-sentence-browser.mjs

      - name: Verify private student progress rules
        if: github.event_name != 'repository_dispatch'
        run: npm run test:rules

      - name: Validate changed content before a content-only release
        if: github.event_name == 'repository_dispatch'
        run: node --test scripts/learning-snapshot.test.mjs scripts/educational.test.mjs scripts/resource-reliability.test.mjs

      - name: Build static catalog and website
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Block incomplete or mismatched exports
        run: node scripts/verify-static-release.mjs && node --max-old-space-size=512 scripts/audit-export-links.mjs && node --test scripts/codi-audio-pipeline.test.mjs

      - name: Retain release manifest for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            out/deployment.json
            out/**/*.html

      - name: Deploy to Firebase Hosting live channel
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAYTECHINSTITUTE }}
          projectId: raytechinstitute
          channelId: live

      - name: Verify deployed pages match this exact export
        run: node scripts/verify-live-export.mjs

      - name: Verify ready MP3 plays on desktop and mobile without an AI call
        if: ${{ !cancelled() && steps.hosting.outcome == 'success' }}
        run: node --max-old-space-size=384 scripts/verify-prepared-audio.mjs && node --max-old-space-size=384 scripts/verify-learning-panels.mjs && node --max-old-space-size=384 scripts/verify-learning-controls.mjs

      - name: Retain learning presentation screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-presentation
          path: artifacts/learning-presentation/*.png
          if-no-files-found: ignore

      - name: Verify all redesigned resource directories and video placement
        if: ${{ !cancelled() && steps.hosting.outcome == 'success' }}
        run: node --max-old-space-size=384 scripts/verify-resource-pages.mjs

      - name: Retain resource page screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resource-pages
          path: artifacts/resource-pages/*.png
          if-no-files-found: ignore

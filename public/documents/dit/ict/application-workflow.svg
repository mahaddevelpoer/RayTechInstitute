<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 135" width="640" height="135" role="img" aria-labelledby="title desc"><title id="title">Checked application workflow</title><desc id="desc">Choose and edit, save an editable source, export if needed, verify and share. Retain source files and required assets.</desc><rect x="10" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="80" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Choose / edit</text><rect x="170" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="240" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Save source</text><rect x="330" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="400" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Export</text><rect x="490" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="560" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Verify / share</text><path d="M153 50h14" stroke="#032c68" stroke-width="2"/><path d="M167 50l-6 -4v8Z" fill="#032c68"/><path d="M313 50h14" stroke="#032c68" stroke-width="2"/><path d="M327 50l-6 -4v8Z" fill="#032c68"/><path d="M473 50h14" stroke="#032c68" stroke-width="2"/><path d="M487 50l-6 -4v8Z" fill="#032c68"/><text x="320" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#032c68">Keep the source and verify the delivery copy</text></svg>
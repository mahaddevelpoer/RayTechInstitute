<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 135" width="640" height="135" role="img" aria-labelledby="title desc"><title id="title">Internet infrastructure and web resource request</title><desc id="desc">A device reaches a router, ISP and Internet networks to contact a web service. DNS assists name resolution. Responses return through networks; actual paths vary.</desc><rect x="10" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="80" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Device</text><rect x="170" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="240" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Router</text><rect x="330" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="400" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">ISP / Internet</text><rect x="490" y="25" width="140" height="50" rx="4" fill="#e8effa" stroke="#032c68"/><text x="560" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#032c68">Web service</text><path d="M153 50h14" stroke="#032c68" stroke-width="2"/><path d="M167 50l-6 -4v8Z" fill="#032c68"/><path d="M313 50h14" stroke="#032c68" stroke-width="2"/><path d="M327 50l-6 -4v8Z" fill="#032c68"/><path d="M473 50h14" stroke="#032c68" stroke-width="2"/><path d="M487 50l-6 -4v8Z" fill="#032c68"/><text x="320" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#032c68">DNS assists name resolution; responses return through networks</text></svg>
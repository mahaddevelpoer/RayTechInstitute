<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-labelledby="title desc"><title id="title">Checked storage copies with suitable separation</title><desc id="desc">Working copy, separate recovery copy and off-site copy. Arrows represent checked copying, not automatic sync or RAID.</desc><rect x="10" y="30" width="170" height="60" rx="4" fill="#e8effa" stroke="#032c68"/><text x="95" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">Working copy</text><rect x="235" y="30" width="170" height="60" rx="4" fill="#e8effa" stroke="#032c68"/><text x="320" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">Recovery copy</text><rect x="460" y="30" width="170" height="60" rx="4" fill="#e8effa" stroke="#032c68"/><text x="545" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">Off-site copy</text><path d="M180 60H228M405 60H453" stroke="#032c68" stroke-width="2"/><path d="M228 60L220 55V65ZM453 60L445 55V65Z" fill="#032c68"/><text x="320" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#032c68">Verify contents and test restoration</text></svg>
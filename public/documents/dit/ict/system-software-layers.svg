<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="title desc"><title id="title">Simplified operating system service relationships</title><desc id="desc">Users interact through programs or a shell. Operating system and kernel services manage resources, with drivers supporting device communication. Hardware supplies computing resources. Execution contexts vary by OS.</desc><rect x="90" y="15" width="460" height="45" rx="4" fill="#e8effa" stroke="#032c68"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">User programs and shell</text><rect x="90" y="85" width="460" height="45" rx="4" fill="#e8effa" stroke="#032c68"/><text x="320" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">OS / kernel services</text><rect x="90" y="155" width="460" height="45" rx="4" fill="#e8effa" stroke="#032c68"/><text x="320" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">Device communication / drivers</text><rect x="90" y="225" width="460" height="45" rx="4" fill="#e8effa" stroke="#032c68"/><text x="320" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#032c68">Hardware resources</text><path d="M310 60v25M330 85v-25" stroke="#032c68" stroke-width="2"/><path d="M310 85l-4 -7h8ZM330 60l-4 7h8Z" fill="#032c68"/><path d="M310 130v25M330 155v-25" stroke="#032c68" stroke-width="2"/><path d="M310 155l-4 -7h8ZM330 130l-4 7h8Z" fill="#032c68"/><path d="M310 200v25M330 225v-25" stroke="#032c68" stroke-width="2"/><path d="M310 225l-4 -7h8ZM330 200l-4 7h8Z" fill="#032c68"/></svg>
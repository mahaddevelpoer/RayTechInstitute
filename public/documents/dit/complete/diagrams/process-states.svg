<svg xmlns="http://www.w3.org/2000/svg" width="850" height="400" viewBox="0 0 850 400" role="img" aria-labelledby="title"><title id="title">Simplified five-state process model</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1b4f9b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="15" fill="#0f172a"><rect x="10" y="100" width="120" height="60" rx="5" fill="#edf4fb" stroke="#1b4f9b"/><text x="70" y="135" text-anchor="middle">New</text><rect x="210" y="100" width="140" height="60" rx="5" fill="#edf4fb" stroke="#1b4f9b"/><text x="280" y="135" text-anchor="middle">Ready</text><rect x="440" y="100" width="140" height="60" rx="5" fill="#edf4fb" stroke="#1b4f9b"/><text x="510" y="135" text-anchor="middle">Running</text><rect x="690" y="100" width="140" height="60" rx="5" fill="#edf4fb" stroke="#1b4f9b"/><text x="760" y="135" text-anchor="middle">Terminated</text><rect x="440" y="300" width="140" height="60" rx="5" fill="#edf4fb" stroke="#1b4f9b"/><text x="510" y="335" text-anchor="middle">Waiting</text><path d="M130 130H205" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="170" y="115" text-anchor="middle">Admit</text><path d="M350 130H435" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="395" y="115" text-anchor="middle">Dispatch</text><path d="M580 130H685" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="635" y="115" text-anchor="middle">Exit</text><path d="M510 160V295" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="575" y="235" text-anchor="middle">Block for I/O</text><path d="M440 330H280V165" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="315" y="310" text-anchor="middle">Event completed</text><path d="M445 100Q390 20 285 95" fill="none" stroke="#1b4f9b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="45" text-anchor="middle">Pre-empt</text><text x="20" y="385">I/O completion makes a task ready; dispatch is still required to run.</text></g></svg>